<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Built In | التقديم على وظيفة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#fff;--mute:#9a9a9a;--line:#2a2a2a;--lime:#C4FF0F;--field:#0e0e0e;--err:#ff6b6b}
*{box-sizing:border-box}
html{background:#000;color-scheme:dark}
body{margin:0;overflow-x:hidden;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,sans-serif;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:40px 20px 70px}
header{text-align:center;margin-bottom:32px}
header img{width:130px;height:auto}
h1{font-size:1.8rem;font-weight:800;margin:16px 0 4px}
header p{color:var(--mute);margin:0}
.f{margin-bottom:20px}
label,.lbl{display:block;font-weight:600;margin-bottom:6px}
label i,.lbl i{color:var(--lime);font-style:normal}
.hint{color:var(--mute);font-size:.85rem;font-weight:400}
input,select{width:100%;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit}
input::placeholder{color:#555}
input:focus,select:focus{outline:2px solid var(--lime);outline-offset:1px;border-color:var(--lime)}
.ltr{direction:ltr;text-align:left}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.err{color:var(--err);font-size:.85rem;min-height:1.2em}
.day{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--field)}
.day b{display:block;margin-bottom:6px}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slots label{margin:0;font-weight:400;cursor:pointer}
.slots input{position:absolute;opacity:0;width:0}
.slots span{display:block;padding:6px 14px;border:1px solid var(--line);border-radius:999px;font-size:.9rem}
.slots input:checked+span{background:var(--lime);color:#000;border-color:var(--lime);font-weight:600}
.slots input:focus-visible+span{outline:2px solid #fff;outline-offset:2px}
button{width:100%;background:var(--lime);color:#000;border:0;border-radius:10px;padding:14px;font:inherit;font-weight:800;font-size:1.1rem;cursor:pointer}
button:hover{filter:brightness(1.08)}button:disabled{opacity:.5;cursor:wait}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hp{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%);pointer-events:none}
#done{display:none;text-align:center;padding:60px 0}
#done h2{color:var(--lime);font-size:1.8rem}
.msg{margin-top:14px;text-align:center;color:var(--err)}
</style>
</head>

<h1>انضم لفريق Built In</h1>
<p>بيانات بسيطة وهنتواصل معاك.</p>
</header>

<form id="form" novalidate>
<input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

<div class="f"><label for="name">الاسم <i>*</i></label><input id="name" name="name" required><div class="err"></div></div>

<div class="row">
<div class="f"><label for="phone">رقم الواتساب <i>*</i></label><input id="phone" name="phone" class="ltr" inputmode="tel" placeholder="01XXXXXXXXX" required><div class="err"></div></div>
<div class="f"><label for="email">الإيميل <i>*</i></label><input id="email" name="email" type="email" class="ltr" required><div class="err"></div></div>
</div>

<div class="row">
<div class="f"><label for="exp">سنوات الخبرة <i>*</i></label>
<select id="exp" name="experience" required><option value="">اختر</option><option>بدون خبرة</option><option>أقل من سنة</option><option>١ - ٣ سنوات</option><option>٣ - ٥ سنوات</option><option>أكتر من ٥ سنوات</option></select><div class="err"></div></div>
<div class="f"><label for="salary">المرتب المتوقع <i>*</i></label><input id="salary" name="salary" inputmode="numeric" placeholder="بالجنيه" required><div class="err"></div></div>
</div>

<div class="f"><label for="start">تقدر تبدأ امتى؟ <i>*</i></label><input id="start" name="start_date" placeholder="فوراً / بعد أسبوعين" required><div class="err"></div></div>

<div class="f">
<span class="lbl">أنسب مواعيد نكلمك فيها <i>*</i> <span class="hint">(من ١٠ ص لـ ٦ م، خلال ٣ أيام)</span></span>
<div id="days"></div>
<div class="err" id="slotErr"></div>
</div>

<button id="btn" type="submit">إرسال</button>
<div class="msg" id="msg" role="alert"></div>
</form>

<div id="done" role="status">
<h2>وصلنا طلبك</h2>
<p>شكراً على وقتك. هنتواصل معاك في المواعيد اللي اخترتها.</p>
</div>
</div>

<script>
// الصق هنا رابط الـ Web App من Google Apps Script
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzyCRmcG-GehkZPutmLko8z2LKBwNfkecqMa3ANfjNVg1PzJwM2STkrWovm3dpX3-g_Fw/exec";

const SLOTS = ['١٠ - ١٢','١٢ - ٢','٢ - ٤','٤ - ٦'];
const daysEl = document.getElementById('days');
for (let i = 1; i <= 3; i++) {
  const d = new Date(); d.setDate(d.getDate() + i);
  const label = d.toLocaleDateString('ar-EG', {weekday:'long', day:'numeric', month:'long'});
  const box = document.createElement('div'); box.className = 'day';
  box.innerHTML = '<b>' + label + '</b><div class="slots">' + SLOTS.map(s =>
    '<label><input type="checkbox" data-day="' + label + '" value="' + s + '"><span>' + s + '</span></label>').join('') + '</div>';
  daysEl.appendChild(box);
}

const form = document.getElementById('form'), btn = document.getElementById('btn'), msg = document.getElementById('msg');

form.addEventListener('submit', async e => {
  e.preventDefault(); msg.textContent = '';
  let ok = true;
  form.querySelectorAll('[required]').forEach(el => {
    const bad = !el.value.trim() || (el.type==='email' && !el.validity.valid);
    el.parentElement.querySelector('.err').textContent = bad ? 'الحقل ده مطلوب أو مكتوب غلط' : '';
    if (bad && ok) el.focus();
    if (bad) ok = false;
  });
  const picked = {};
  daysEl.querySelectorAll('input:checked').forEach(c => (picked[c.dataset.day] = picked[c.dataset.day] || []).push(c.value));
  const slots = Object.entries(picked).map(([d, s]) => d + ': ' + s.join(' / ')).join(' | ');
  document.getElementById('slotErr').textContent = slots ? '' : 'اختار ميعاد واحد على الأقل';
  if (!slots) ok = false;
  if (!ok) return;
  if (form.website.value) return;
  if (ENDPOINT.startsWith('PASTE')) { msg.textContent = 'لسه ما اتحطش رابط الشيت في الكود.'; return; }

  btn.disabled = true; btn.textContent = 'جاري الإرسال...';
  try {
    const data = new URLSearchParams(new FormData(form));
    data.set('slots', slots);
    await fetch(ENDPOINT, {method:'POST', mode:'no-cors', body:data});
    form.style.display = 'none';
    document.querySelector('header').style.display = 'none';
    document.getElementById('done').style.display = 'block';
    window.scrollTo(0,0);
  } catch (err) {
    msg.textContent = 'حصلت مشكلة في الإرسال، جرب تاني.';
    btn.disabled = false; btn.textContent = 'إرسال';
  }
});
</script>
